{% extends "base.html" %}
{% block title %}Forbidden{% endblock %}
{% block content %}

<div class="row justify-content-center text-center">
    <div class="col-md-6">
        <div class="display-1 fw-bold text-warning mb-3">403</div>
        <h1 class="h3 mb-3">Access Forbidden</h1>
        <p class="text-muted mb-4">
            You don't have permission to view or modify this. If you think this is a mistake,
            make sure you're logged in with the right account.
        </p>
        <a href="{{ url_for('recipes.list_recipes') }}" class="btn btn-primary">
            Back to Recipes
        </a>
    </div>
</div>

{% endblock %}
